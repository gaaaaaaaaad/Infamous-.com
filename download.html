<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infamous - Download Center</title>
    <link rel="icon" href="images/logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles-new.css">
    <style>
        /* Download Page Specific Styles */
        .download-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 80px;
            position: relative;
        }

        .download-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(225, 29, 72, 0.1) 0%, transparent 60%),
                radial-gradient(ellipse 40% 30% at 20% 80%, rgba(244, 63, 94, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .download-container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .download-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .download-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: block;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 12px;
            background: var(--card-bg);
        }

        .download-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--light-text);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .download-header p {
            font-size: 1rem;
            color: var(--muted-text);
        }

        .download-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .download-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            transition: all var(--transition-normal);
        }

        .download-item:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .download-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .download-item-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(225, 29, 72, 0.1);
            border: 1px solid rgba(225, 29, 72, 0.2);
            border-radius: var(--radius-md);
            color: var(--primary);
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .download-details h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--light-text);
            margin-bottom: 2px;
        }

        .download-details p {
            font-size: 0.8125rem;
            color: var(--muted-text);
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
            font-family: inherit;
        }

        .btn-download:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
        }

        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-download.success {
            background: var(--success);
        }

        .btn-download.secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--muted-text);
        }

        .btn-download.secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--light-text);
            box-shadow: none;
        }

        .status-message {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            text-align: center;
            display: none;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: var(--success);
        }

        .status-info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            color: #60a5fa;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .action-buttons .btn {
            flex: 1;
            min-width: 150px;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--muted-text);
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-normal);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-buttons .btn:hover {
            border-color: var(--border-hover);
            color: var(--light-text);
            background: var(--card-bg-hover);
        }

        /* Simple icon replacements */
        .icon-download::before { content: "↓"; }
        .icon-rocket::before { content: "🚀"; }
        .icon-shirt::before { content: "👕"; }
        .icon-car::before { content: "🚗"; }
        .icon-home::before { content: "🏠"; }
        .icon-book::before { content: "📖"; }
        .icon-help::before { content: "❓"; }
        .icon-check::before { content: "✓"; }
        .icon-link::before { content: "→"; }
        .icon-spinner { animation: spin 1s linear infinite; display: inline-block; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-message[style*="block"] {
            animation: fadeIn 0.3s ease;
        }

        @media (max-width: 768px) {
            .download-page {
                padding: 100px 20px 60px;
            }

            .download-header h1 {
                font-size: 1.5rem;
            }

            .download-item {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }

            .download-info {
                flex-direction: column;
                gap: 12px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .download-icon {
                width: 64px;
                height: 64px;
            }

            .download-item-icon {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="images/logo.png" alt="Infamous Logo" class="logo-img">
                <span class="logo-text">Infamous</span>
            </a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="store.html" class="nav-link">Store</a></li>
                <li class="nav-item"><a href="setup.html" class="nav-link">Setup</a></li>
                <li class="nav-item"><a href="reseller.html" class="nav-link">Resellers</a></li>
                <li class="nav-item"><a href="https://proudlyauthentication.com/customers/613591817/infamous" class="nav-link" target="_blank">Login</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main class="download-page">
        <div class="download-container">
            <div class="download-header">
                <img src="images/logo.png" alt="Infamous Loader" class="download-icon">
                <h1>Download Center</h1>
                <p>Get the latest version of Infamous</p>
            </div>

            <div class="download-grid">
                <!-- Infamous Loader -->
                <div class="download-item">
                    <div class="download-info">
                        <div class="download-item-icon">
                            <span class="icon-rocket"></span>
                        </div>
                        <div class="download-details">
                            <h3>Infamous Loader</h3>
                            <p>Main application launcher</p>
                        </div>
                    </div>
                    <button class="btn-download" id="download-loader-btn">
                        <span class="icon-download"></span>
                        Download
                    </button>
                </div>

                <!-- Outfits Collection -->
                <div class="download-item">
                    <div class="download-info">
                        <div class="download-item-icon">
                            <span class="icon-shirt"></span>
                        </div>
                        <div class="download-details">
                            <h3>Outfits Collection</h3>
                            <p>Browse and download custom outfits</p>
                        </div>
                    </div>
                    <button class="btn-download secondary" id="download-outfits-btn">
                        <span class="icon-link"></span>
                        View Outfits
                    </button>
                </div>

                <!-- Vehicles Collection -->
                <div class="download-item">
                    <div class="download-info">
                        <div class="download-item-icon">
                            <span class="icon-car"></span>
                        </div>
                        <div class="download-details">
                            <h3>Vehicles Collection</h3>
                            <p>Browse and download custom vehicles</p>
                        </div>
                    </div>
                    <button class="btn-download secondary" id="download-vehicles-btn">
                        <span class="icon-link"></span>
                        View Vehicles
                    </button>
                </div>
            </div>

            <div class="status-message" id="status-message"></div>

            <div class="action-buttons">
                <a href="index.html" class="btn">
                    <span class="icon-home"></span>
                    Back to Home
                </a>
                <a href="setup.html" class="btn">
                    <span class="icon-book"></span>
                    Setup Guide
                </a>
                <button class="btn" id="help-btn">
                    <span class="icon-help"></span>
                    Need Help?
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        // Download handler
        const statusMessage = document.getElementById('status-message');

        function showMessage(message, type = 'info') {
            statusMessage.innerHTML = message;
            statusMessage.className = `status-message status-${type}`;
            statusMessage.style.display = 'block';

            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 8000);
        }

        // Loader download
        document.getElementById('download-loader-btn').addEventListener('click', function() {
            const button = this;
            button.disabled = true;
            button.innerHTML = '<span class="icon-spinner">↻</span> Preparing...';

            setTimeout(() => {
                try {
                    const link = document.createElement('a');
                    link.href = "downloads/Infamous Installer.exe";
                    link.download = "Infamous Launcher.zip";
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    button.innerHTML = '<span class="icon-check"></span> Downloaded';
                    button.classList.add('success');
                    showMessage('Download complete! Check your downloads folder.', 'success');
                } catch (error) {
                    button.disabled = false;
                    button.innerHTML = '<span class="icon-download"></span> Download';
                    showMessage('Download failed. Please try again.', 'info');
                }
            }, 1500);
        });

        // Outfits redirect
        document.getElementById('download-outfits-btn').addEventListener('click', function() {
            window.location.href = 'outfits.html';
        });

        // Vehicles redirect
        document.getElementById('download-vehicles-btn').addEventListener('click', function() {
            window.location.href = 'vehicles.html';
        });

        // Help button
        document.getElementById('help-btn').addEventListener('click', function() {
            showMessage(`
                <strong>Quick Setup Guide</strong><br><br>
                1. Extract the ZIP file to a folder<br>
                2. Run the executable as Administrator<br>
                3. If Windows blocks it, click "More info" then "Run anyway"<br>
                4. Check our <a href="setup.html" style="color: #fb7185; text-decoration: underline;">Setup Guide</a> for details
            `, 'info');
        });
    </script>
</body>
</html>
