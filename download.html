<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infamous - Download Center</title>
    <link rel="icon" href="images/logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Minimal page-specific styles only */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
        }

        .download-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .download-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .download-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            display: block;
            border-radius: 20px;
            box-shadow: var(--shadow-glow);
        }

        .download-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--gradient-primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .download-header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .download-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 32px;
        }

        .download-item {
            background: var(--bg-glass);
            backdrop-filter: var(--blur-md);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            transition: all var(--transition-normal);
        }

        .download-item:hover {
            background: var(--bg-glass-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .download-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        .download-item-icon {
            font-size: 2rem;
            color: var(--primary-color);
            background: rgba(220, 38, 38, 0.1);
            padding: 12px;
            border-radius: 12px;
            min-width: 56px;
            text-align: center;
        }

        .download-details h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .download-details p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
        }

        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-download.success {
            background: var(--success-color);
        }

        .btn-secondary {
            background: var(--gradient-accent);
            color: var(--bg-primary);
        }

        .btn-secondary:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .status-message {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .status-info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .action-buttons .btn {
            flex: 1;
            min-width: 180px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .download-header h1 {
                font-size: 2rem;
            }

            .download-item {
                flex-direction: column;
                text-align: center;
            }

            .download-info {
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Simplified Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="images/logo.png" alt="Infamous Logo" class="logo-img">
                <span class="logo-text">Infamous</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="store.html" class="nav-link">Store</a></li>
                <li class="nav-item"><a href="reseller.html" class="nav-link">Resellers</a></li>
                <li class="nav-item"><a href="setup.html" class="nav-link">Setup</a></li>
                <li class="nav-item"><a href="tos.html" class="nav-link">Terms</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="download-container">
        <div class="download-header">
            <img src="images/logo.png" alt="Infamous Loader" class="download-icon">
            <h1><i class="fas fa-download"></i> Download Center</h1>
            <p>Choose what you want to download</p>
        </div>

        <div class="download-grid">
            <!-- Infamous Loader -->
            <div class="download-item">
                <div class="download-info">
                    <i class="fas fa-rocket download-item-icon"></i>
                    <div class="download-details">
                        <h3>Infamous Loader</h3>
                        <p>Main application launcher</p>
                    </div>
                </div>
                <button class="btn-download" id="download-loader-btn">
                    <i class="fas fa-download"></i>
                    Download
                </button>
            </div>

            <!-- Outfits Collection -->
            <div class="download-item">
                <div class="download-info">
                    <i class="fas fa-tshirt download-item-icon"></i>
                    <div class="download-details">
                        <h3>Outfits Collection</h3>
                        <p>Browse and download custom outfits</p>
                    </div>
                </div>
                <button class="btn-download btn-secondary" id="download-outfits-btn">
                    <i class="fas fa-external-link-alt"></i>
                    View Outfits
                </button>
            </div>

            <!-- Vehicles Collection -->
            <div class="download-item">
                <div class="download-info">
                    <i class="fas fa-car download-item-icon"></i>
                    <div class="download-details">
                        <h3>Vehicles Collection</h3>
                        <p>Browse and download custom vehicles</p>
                    </div>
                </div>
                <button class="btn-download btn-secondary" id="download-vehicles-btn">
                    <i class="fas fa-external-link-alt"></i>
                    View Vehicles
                </button>
            </div>
        </div>

        <div class="status-message" id="status-message"></div>

        <div class="action-buttons">
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-home"></i>
                Back to Home
            </a>
            <a href="setup.html" class="btn btn-secondary">
                <i class="fas fa-book-open"></i>
                Setup Guide
            </a>
            <button class="btn btn-secondary" id="help-btn">
                <i class="fas fa-question-circle"></i>
                Need Help?
            </button>
        </div>
    </div>

    <script>
        // Simple, optimized download handler
        const statusMessage = document.getElementById('status-message');

        function showMessage(message, type = 'info') {
            statusMessage.innerHTML = message;
            statusMessage.className = `status-message status-${type}`;
            statusMessage.style.display = 'block';

            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 8000);
        }

        // Loader download
        document.getElementById('download-loader-btn').addEventListener('click', function() {
            const button = this;
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparing...';

            setTimeout(() => {
                try {
                    const link = document.createElement('a');
                    link.href = "downloads/Infamous Launcher.zip";
                    link.download = "Infamous Launcher.zip";
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    button.innerHTML = '<i class="fas fa-check"></i> Downloaded';
                    button.classList.add('success');
                    showMessage('<i class="fas fa-check-circle"></i> Download complete! Check your downloads folder.', 'success');
                } catch (error) {
                    button.disabled = false;
                    button.innerHTML = '<i class="fas fa-download"></i> Download';
                    showMessage('<i class="fas fa-exclamation-triangle"></i> Download failed. Please try again.', 'info');
                }
            }, 2000);
        });

        // Outfits redirect
        document.getElementById('download-outfits-btn').addEventListener('click', function() {
            window.location.href = 'outfits.html';
        });

        // Vehicles redirect
        document.getElementById('download-vehicles-btn').addEventListener('click', function() {
            window.location.href = 'vehicles.html';
        });

        // Help button
        document.getElementById('help-btn').addEventListener('click', function() {
            showMessage(`
                <strong><i class="fas fa-info-circle"></i> Quick Setup Guide</strong><br><br>
                1. Extract the ZIP file to a folder<br>
                2. Run the executable as Administrator<br>
                3. If Windows blocks it, click "More info" → "Run anyway"<br>
                4. Check our <a href="setup.html" style="color: var(--accent-color); text-decoration: underline;">Setup Guide</a> for details
            `, 'info');
        });

        // Initialize navigation (from main script.js)
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');

        if (hamburger && navMenu) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
